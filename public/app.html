<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스케줄 캘린더</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<div class="app-layout">

  <!-- ── 상단 네비 ──────────────────────────────────── -->
  <nav class="navbar">
    <div class="navbar-brand">
      <span class="icon">🗓️</span>
      스케줄 캘린더
    </div>
    <div class="navbar-user">
      <span>안녕하세요, <strong id="nav-username"></strong>님</span>
      <button class="btn btn-ghost" id="btn-logout" style="padding:6px 14px;font-size:.85rem">
        로그아웃
      </button>
    </div>
  </nav>

  <!-- ── 메인 콘텐츠 ────────────────────────────────── -->
  <div class="app-main">

    <!-- 캘린더 영역 -->
    <section class="calendar-section" id="calendar-section"></section>

    <!-- 사이드 패널 -->
    <aside class="side-panel">
      <div class="side-header">
        <div>
          <h2>일정</h2>
          <div class="side-date" id="side-date">날짜를 선택하세요</div>
        </div>
      </div>

      <!-- 검색 바 -->
      <div style="padding:10px 20px;border-bottom:1px solid var(--bd)">
        <input type="search" id="search-input" placeholder="🔍 제목/메모 검색..."
          style="width:100%;background:var(--s3);border:1px solid var(--bd);color:var(--txt);
                 border-radius:6px;padding:7px 12px;outline:none;font-size:.85rem">
      </div>

      <!-- 통계 바 -->
      <div id="stats-bar" style="display:flex;gap:12px;padding:10px 20px;
           border-bottom:1px solid var(--bd);font-size:.78rem;color:var(--mu)">
        <span>전체 <strong id="stat-total" style="color:var(--txt)">-</strong></span>
        <span>이번달 <strong id="stat-month" style="color:var(--acc)">-</strong></span>
        <span>예정 <strong id="stat-upcoming" style="color:var(--grn)">-</strong></span>
      </div>

      <div class="side-body">
        <div class="schedule-list" id="schedule-list">
          <div class="no-schedule">
            <span class="icon">📅</span>
            날짜를 클릭해 일정을 확인하세요
          </div>
        </div>
      </div>

      <div class="add-btn-wrap">
        <button class="btn btn-primary" id="btn-add-schedule">
          + 일정 추가
        </button>
      </div>
    </aside>

  </div>
</div>

<!-- 일정 추가/수정 모달 -->
<div class="modal-overlay hidden" id="modal-overlay"></div>

<!-- 토스트 -->
<div id="toast-container"></div>

<script type="module" src="/js/app.js"></script>
</body>
</html>
